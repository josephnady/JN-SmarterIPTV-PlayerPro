<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f14"/>
      <stop offset="55%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#171a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#e8a33d" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#e8a33d" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#e8a33d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c26"/>
      <stop offset="100%" stop-color="#14161e"/>
    </linearGradient>
    <style>
      .disp { font-family: 'Segoe UI', 'Arial Black', Helvetica, Arial, sans-serif; font-weight: 700; }
      .mono { font-family: 'Consolas', 'SFMono-Regular', Menlo, Monaco, monospace; }
      .body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0% { r: 4.5; opacity: 1; } 60% { r: 9; opacity: 0; } 100% { r: 9; opacity: 0; } }
      @keyframes meter1 { 0%,100% { height: 10px; y: 34px; } 50% { height: 22px; y: 22px; } }
      @keyframes meter2 { 0%,100% { height: 18px; y: 26px; } 50% { height: 30px; y: 14px; } }
      @keyframes meter3 { 0%,100% { height: 26px; y: 18px; } 50% { height: 14px; y: 30px; } }
      @keyframes meter4 { 0%,100% { height: 14px; y: 30px; } 50% { height: 28px; y: 16px; } }
      @keyframes meter5 { 0%,100% { height: 22px; y: 22px; } 50% { height: 10px; y: 34px; } }
      .m1{ animation: meter1 1.6s ease-in-out infinite; }
      .m2{ animation: meter2 1.6s ease-in-out infinite .1s; }
      .m3{ animation: meter3 1.6s ease-in-out infinite .2s; }
      .m4{ animation: meter4 1.6s ease-in-out infinite .3s; }
      .m5{ animation: meter5 1.6s ease-in-out infinite .4s; }
      .ping{ animation: pulse 1.8s ease-out infinite; }
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- faint concentric broadcast arcs, signature motif -->
  <g stroke="#e8a33d" fill="none" opacity="0.10">
    <circle cx="1040" cy="200" r="90"/>
    <circle cx="1040" cy="200" r="150"/>
    <circle cx="1040" cy="200" r="210"/>
  </g>
  <!-- hairline scan texture -->
  <g stroke="#ffffff" opacity="0.025">
    <line x1="0" y1="60" x2="1280" y2="60"/>
    <line x1="0" y1="140" x2="1280" y2="140"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(70,56)">
    <path d="M12 2C6.48 2 2 6.48 2 12c0 3.31 1.62 6.24 4.11 8.05" stroke="#e8a33d" stroke-width="1.6" stroke-linecap="round" fill="none" transform="scale(1.6)"/>
    <path d="M12 6.5c-3.04 0-5.5 2.46-5.5 5.5 0 1.9.96 3.57 2.42 4.56" stroke="#e8a33d" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7" transform="scale(1.6)"/>
    <circle cx="19.2" cy="19.2" r="4.16" fill="#e8a33d"/>
  </g>

  <!-- Eyebrow -->
  <text x="70" y="140" class="mono" font-size="15" letter-spacing="4" fill="#e8a33d">JN SMARTER</text>

  <!-- Title -->
  <text x="68" y="205" class="disp" font-size="58" fill="#eef0f4">IPTV Player</text>
  <text x="68" y="266" class="disp" font-size="58" fill="#e8a33d">Pro</text>

  <!-- Subtitle -->
  <text x="70" y="308" class="body" font-size="17" fill="#8b93a7">Xtream Codes login · M3U / M3U8 playlists · Live EPG guide · Desktop app</text>

  <!-- Feature pills -->
  <g class="mono" font-size="12.5" fill="#8b93a7">
    <rect x="70" y="332" width="118" height="30" rx="8" fill="#171a23" stroke="#262b38"/>
    <text x="88" y="351">XTREAM LOGIN</text>

    <rect x="200" y="332" width="90" height="30" rx="8" fill="#171a23" stroke="#262b38"/>
    <text x="218" y="351">M3U / TS</text>

    <rect x="302" y="332" width="98" height="30" rx="8" fill="#171a23" stroke="#262b38"/>
    <text x="320" y="351">EPG GUIDE</text>

    <rect x="412" y="332" width="112" height="30" rx="8" fill="#171a23" stroke="#262b38"/>
    <text x="430" y="351">WIN · MAC · LINUX</text>
  </g>

  <!-- Tuner dial card (mirrors the in-app signature element) -->
  <g transform="translate(760,140)">
    <rect x="0" y="0" width="450" height="150" rx="14" fill="url(#cardGrad)" stroke="#262b38"/>

    <!-- live badge -->
    <g transform="translate(370,24)">
      <circle cx="0" cy="0" r="4.5" fill="#37c99a"/>
      <circle cx="0" cy="0" r="4.5" fill="#37c99a" opacity="0.6" class="ping"/>
      <text x="12" y="4" class="mono" font-size="11" letter-spacing="2" fill="#37c99a">LIVE</text>
    </g>

    <!-- channel number -->
    <text x="28" y="70" class="disp" font-size="46" fill="#e8a33d">07</text>
    <text x="30" y="90" class="mono" font-size="11" letter-spacing="2" fill="#565d70">CH</text>

    <line x1="96" y1="24" x2="96" y2="112" stroke="#262b38"/>

    <text x="118" y="60" class="body" font-size="17" fill="#eef0f4" font-weight="600">Big Buck Channel</text>
    <text x="118" y="82" class="mono" font-size="11.5" fill="#8b93a7">Now: Feature Show · Next: Nightly News</text>

    <!-- signal meter -->
    <g transform="translate(118,96)" fill="#37c99a">
      <rect class="m1" x="0"  width="4" rx="2"/>
      <rect class="m2" x="8"  width="4" rx="2"/>
      <rect class="m3" x="16" width="4" rx="2"/>
      <rect class="m4" x="24" width="4" rx="2"/>
      <rect class="m5" x="32" width="4" rx="2"/>
    </g>
  </g>

  <!-- mini channel rows to ground it in the app's sidebar language -->
  <g transform="translate(760,318)">
    <g transform="translate(0,0)">
      <rect width="140" height="40" rx="8" fill="#171a23" stroke="#262b38"/>
      <circle cx="20" cy="20" r="9" fill="#1c202a" stroke="#262b38"/>
      <rect x="38" y="12" width="70" height="6" rx="3" fill="#3a4152"/>
      <rect x="38" y="23" width="46" height="5" rx="2.5" fill="#2a3040"/>
    </g>
    <g transform="translate(155,0)">
      <rect width="140" height="40" rx="8" fill="#171a23" stroke="#262b38"/>
      <circle cx="20" cy="20" r="9" fill="#1c202a" stroke="#262b38"/>
      <rect x="38" y="12" width="70" height="6" rx="3" fill="#3a4152"/>
      <rect x="38" y="23" width="46" height="5" rx="2.5" fill="#2a3040"/>
    </g>
    <g transform="translate(310,0)">
      <rect width="140" height="40" rx="8" fill="#171a23" stroke="#262b38"/>
      <circle cx="20" cy="20" r="9" fill="#1c202a" stroke="#262b38"/>
      <rect x="38" y="12" width="70" height="6" rx="3" fill="#3a4152"/>
      <rect x="38" y="23" width="46" height="5" rx="2.5" fill="#2a3040"/>
    </g>
  </g>
</svg>
